name: Prepare brand icons
on:
  push:
    branches: ['assets/prepare-brand-icons-2026-11-26']
permissions:
  contents: read
jobs:
  icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate icons
        run: |
          python - <<'PY'
          from PIL import Image
          import io, hashlib, base64
          image = Image.open('brand-source.webp').convert('RGB')
          assert image.size == (180,180)
          for name,size,fmt in [('favicon-48.png',48,'PNG'),('apple-touch-icon.png',180,'PNG'),('favicon.ico',48,'ICO')]:
              out=io.BytesIO()
              resized=image.resize((size,size),Image.Resampling.LANCZOS)
              if fmt=='PNG':
                  resized=resized.quantize(colors=128)
                  resized.save(out,fmt,optimize=True)
              else:
                  resized.save(out,fmt,sizes=[(16,16),(32,32),(48,48)])
              data=out.getvalue()
              check=Image.open(io.BytesIO(data))
              assert check.size==(size,size)
              gitsha=hashlib.sha1(('blob '+str(len(data))).encode()+bytes([0])+data).hexdigest()
              print('ICON_META',name,len(data),gitsha)
              encoded=base64.b64encode(data).decode()
              for i in range(0,len(encoded),1000):
                  print('ICON_CHUNK',name,i//1000,encoded[i:i+1000])
          PY
