name: Verify mobile browser layouts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'perf/mobile-responsive-*']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.2'
      - run: python -m pip install -r requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_mobile_browser.py
