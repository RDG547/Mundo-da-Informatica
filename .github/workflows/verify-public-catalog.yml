name: Verify public catalog
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'perf/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_public_flows.py tests/test_technical_content_engine.py
