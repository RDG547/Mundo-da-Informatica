services:
  - type: web
    name: mundodainformatica
    runtime: python
    buildCommand: |
      pip install -r requirements.txt &&
      mkdir -p /opt/render/project/src/data/images/posts /opt/render/project/src/data/images/profiles /opt/render/project/src/data/images/admin /opt/render/project/src/data/uploads/profiles &&
      ([ -L /opt/render/project/src/instance ] && rm -f /opt/render/project/src/instance || true) &&
      ([ -L /opt/render/project/src/static/images ] && rm -f /opt/render/project/src/static/images || true) &&
      ([ -L /opt/render/project/src/static/uploads ] && rm -f /opt/render/project/src/static/uploads || true) &&
      ln -sfn /opt/render/project/src/data /opt/render/project/src/instance &&
      ln -sfn /opt/render/project/src/data/images /opt/render/project/src/static/images &&
      ln -sfn /opt/render/project/src/data/uploads /opt/render/project/src/static/uploads
    # O disco persistente do Render é montado no runtime. A migração precisa
    # acontecer aqui para atingir o site.db real, antes de qualquer worker web.
    startCommand: python migrate_db.py && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/data/site.db
      - key: SITE_URL
        value: https://mundodainformatica.com
      - key: CANONICAL_HOST
        value: mundodainformatica.com
      - key: DOWNLOAD_DELIVERY_MODE
        value: proxy
      - key: TECHNICAL_IMPORT_ENABLED
        value: "true"
      - key: TECHNICAL_CONTRIBUTIONS_ENABLED
        value: "true"
      - key: TECHNICAL_IMPORT_TEMP_DIR
        value: /opt/render/project/src/data/technical-imports
      - key: TECHNICAL_LOCAL_STORAGE_DIR
        value: /opt/render/project/src/data/technical-files
      - key: ENABLE_DATASHEET_ENGINE
        value: "true"
      - key: DISABLE_ALL_DATASHEET_AUTOMATION
        value: "false"
      - key: ENABLE_SOURCE_PARTS
        value: "true"
      - key: ENABLE_ALLDATASHEET_API
        value: "false"
      - key: ENABLE_ALLDATASHEET_HTML
        value: "false"
      - key: ENABLE_DATASHEETS_COM_API
        value: "false"
      - key: ENABLE_DATASHEETS_COM_HTML
        value: "false"
      - key: SOURCE_PARTS_API_URL
        value: https://api.source.parts/v1
      - key: SOURCE_PARTS_USER_AGENT
        value: "MundoDaInformatica/1.0 (contato: suporte@mundodainformatica.com)"
      - key: SOURCE_PARTS_API_KEY
        sync: false
      - key: ALLDATASHEET_API_KEY
        sync: false
      - key: ALLDATASHEET_API_URL
        sync: false
      - key: ALLDATASHEET_API_AUTH_HEADER
        sync: false
      - key: ALLDATASHEET_API_QUERY_PARAMETER
        sync: false
      - key: DATASHEETS_COM_API_KEY
        sync: false
      - key: MANUFACTURER_DATASHEET_FEED_URL
        sync: false
      - key: MANUFACTURER_DATASHEET_FEED_TOKEN
        sync: false
      - key: LICENSED_DATASHEET_FEED_URL
        sync: false
      - key: LICENSED_DATASHEET_FEED_TOKEN
        sync: false
      # IDs de produto são identificadores públicos; chaves e webhooks devem
      # ser configurados como secrets no painel do Render.
      - key: STRIPE_PRODUCT_PREMIUM
        value: prod_TWO90kFHcUFjHq
      - key: STRIPE_PRODUCT_VIP
        value: prod_TWOCCLcm6V4BRN
    # Disco persistente unificado para banco e uploads
    disk:
      name: persistent-data
      mountPath: /opt/render/project/src/data
      sizeGB: 3
