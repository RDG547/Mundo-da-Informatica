{% extends "base.html" %}

{% block content %}
<section class="error-page">
    <div class="container">
        <div class="error-content" data-aos="fade-up">
            <div class="error-number" aria-hidden="true">404</div>
            <h1>Página não encontrada</h1>
            <p>A página que você está procurando não existe ou pode ter sido movida.</p>
            <form action="{{ url_for('search') }}" method="get" class="search-bar">
                <label for="error-search" class="sr-only">Pesquisar por modelo ou código da placa</label>
                <input id="error-search" type="search" name="q" placeholder="Modelo ou código da placa" required>
                <button type="submit"><i class="fas fa-search" aria-hidden="true"></i> Buscar</button>
            </form>
            <a href="{{ url_for('home') }}" class="btn">Voltar ao início <i class="fas fa-home" aria-hidden="true"></i></a>
            <a href="{{ url_for('all_categories') }}" class="btn btn-outline">Ver categorias</a>
            <a href="{{ url_for('content_requests') }}" class="btn btn-outline">Sugerir conteúdo</a>
        </div>
    </div>
</section>
{% endblock %}
