{% extends "base.html" %}

{% block content %}
<section class="error-page">
    <div class="container">
        <div class="error-content" data-aos="fade-up">
            <div class="error-number" aria-hidden="true">500</div>
            <h1>Não foi possível concluir agora</h1>
            <p>O servidor encontrou um erro inesperado. Tente novamente em alguns instantes.</p>
            <a href="{{ url_for('home') }}" class="btn">Voltar ao início <i class="fas fa-home" aria-hidden="true"></i></a>
        </div>
    </div>
</section>
{% endblock %}
